apiVersion: apps/v1
kind: Deployment
metadata:
  name: cognitiveweave-agents
  namespace: cognitiveweave
  labels:
    app: cognitiveweave-agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cognitiveweave-agents
  template:
    metadata:
      labels:
        app: cognitiveweave-agents
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      initContainers:
        - name: wait-for-neo4j
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until nc -z neo4j 7687; do echo waiting for neo4j; sleep 3; done"
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until nc -z redis 6379; do echo waiting for redis; sleep 2; done"
      containers:
        - name: agents
          image: cognitiveweave:latest
          command: ["uv", "run", "python", "-m", "cognitiveweave.entrypoint"]
          envFrom:
            - configMapRef:
                name: cognitiveweave-config
            - secretRef:
                name: cognitiveweave-secrets
          ports:
            - containerPort: 8000
              name: metrics
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          volumeMounts:
            - name: faiss-data
              mountPath: /data
      volumes:
        - name: faiss-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cognitiveweave-agents
  namespace: cognitiveweave
spec:
  selector:
    app: cognitiveweave-agents
  ports:
    - name: metrics
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cognitiveweave-mcp
  namespace: cognitiveweave
  labels:
    app: cognitiveweave-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cognitiveweave-mcp
  template:
    metadata:
      labels:
        app: cognitiveweave-mcp
    spec:
      containers:
        - name: mcp
          image: cognitiveweave:latest
          command: ["uv", "run", "python", "-m", "cognitiveweave.mcp.server"]
          envFrom:
            - configMapRef:
                name: cognitiveweave-config
            - secretRef:
                name: cognitiveweave-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
