apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: cognitiveweave
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: cognitiveweave-agents
        static_configs:
          - targets: ["cognitiveweave-agents:8000"]
        metrics_path: /metrics

      - job_name: neo4j
        static_configs:
          - targets: ["neo4j:2004"]
        metrics_path: /metrics

      - job_name: redis
        static_configs:
          - targets: ["redis:9121"]
