[project]
name = "cognitiveweave"
version = "0.1.0"
description = "Multi-agent epistemological memory infrastructure with temporal graph optimization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.13.2",
    "mcp>=1.26.0",
    "minio>=7.2.20",
    "neo4j>=6.1.0",
    "numpy>=2.4.2",
    "plotly>=6.6.0",
    "redis>=7.2.1",
    "sentence-transformers>=5.2.3",
    "streamlit>=1.55.0",
]

[dependency-groups]
dev = [
    "hatchling>=1.29.0",
    "mypy>=2.1.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # allow assert in tests

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false
warn_return_any = false        # third-party drivers (neo4j, redis) return Any; too noisy
warn_unused_ignores = false    # stub versions differ across environments; avoids false positives

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
